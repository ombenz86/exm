<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - BNZexm CBT</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--tx:#1f2340;--mut:#6b7090;--pri:#4a5490;--pri2:#3a4377;--bd:#dfe2ef;--err:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14162a;--card:#1e2140;--tx:#e8eaf8;--mut:#9aa0c8;--bd:#32365e;--pri:#6b77c9;--pri2:#5662b4}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
button:hover{background:var(--pri2)}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:var(--err)}
button:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--pri);color:#fff;text-align:left;padding:10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top;max-width:340px;overflow-wrap:anywhere}
td.act{white-space:nowrap}
td.act button{padding:5px 9px;font-size:12px;margin-right:4px}
.empty{text-align:center;color:var(--mut);padding:24px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.show{display:flex}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.gen{flex:0 0 auto!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.mut{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 12px;border:1px solid var(--bd);border-radius:99px;font-size:12px;cursor:pointer;background:var(--bg)}
.chip:hover{background:var(--pri);color:#fff}
</style>
</head>
<body>
<div class="card" id="loginView" style="max-width:360px;margin:12vh auto">
  <h1>🔐 Admin BNZexm CBT</h1>
  <label>Password Admin</label>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <div style="margin-top:14px"><button id="btnLogin" style="width:100%">Masuk</button></div>
  <div id="loginErr" style="display:none;color:#c0392b;font-size:13px;margin-top:10px"></div>
</div>
<div class="wrap" id="appView" style="display:none">
  <header>
    <h1>📚 Admin BNZexm CBT</h1>
    <div><button class="ghost" id="btnRefresh">⟳ Muat Ulang</button> <button class="ghost" id="btnOut">Keluar</button></div>
  </header>
  <div id="err" style="display:none;background:#fff4d6;color:#4a3b00;border:1px solid #e0c867;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px"></div>
  <div class="tabs">
    <button data-t="ujian" class="on">Ujian (Sheet 1)</button>
    <button data-t="guru">Guru (Sheet 2)</button>
  </div>
  <div class="bar">
    <input id="q" placeholder="Cari...">
    <button id="btnAdd">+ Tambah</button>
  </div>
  <div class="card tw"><table id="tbl"></table></div>
  <p class="mut" id="count"></p>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h1 id="mTitle" style="font-size:18px"></h1>
    <div id="mBody"></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="ghost" id="mCancel">Batal</button>
      <button id="mSave">Simpan</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* Penghubung ke Apps Script. Ganti API jika URL penerapan berubah. */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbwAokyOBdnoPizKzFFiBU5xhMh694BjNwQEPEthHng8fTkhvWduOytSF0tF3GsrB4bQ/exec";
  var MAP = { adminLogin: "login", adminGetExams: "list_exams", adminGetTeachers: "list_teachers",
    adminAddExam: "add_exam", adminEditExam: "edit_exam", adminDeleteExam: "delete_exam",
    adminAddTeacher: "add_teacher", adminEditTeacher: "edit_teacher", adminDeleteTeacher: "delete_teacher" };
  function chain() {
    var ok = function () {}, fail = function () {};
    var p = new Proxy({}, { get: function (_, k) {
      if (k === "withSuccessHandler") return function (f) { ok = f; return p; };
      if (k === "withFailureHandler") return function (f) { fail = f; return p; };
      return function (pass, arg) {
        fetch(API, { method: "POST", body: JSON.stringify({ action: MAP[k], pass: pass, arg: arg }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j && j.fatal) fail({ message: j.message }); else ok(j && j.data !== undefined ? j.data : j); })
          .catch(function () { fail({ message: "Gagal terhubung ke script. Cek URL dan akses penerapan (Siapa saja)." }); });
      };
    } });
    return p;
  }
  window.google = { script: {} };
  Object.defineProperty(window.google.script, "run", { get: chain });
})();
</script>
<script>
let exams = [];
let teachers = [];
let tab = "ujian", editRow = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(m, err) {
  const t = $("#toast"); t.textContent = m; t.style.background = err ? "#c0392b" : "#222";
  t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3000);
}

function render() {
  const q = $("#q").value.toLowerCase();
  let h;
  if (tab === "ujian") {
    const rows = exams.filter(o => [o.token, o.mapel, o.kelas, o.link].join(" ").toLowerCase().includes(q));
    h = "<thead><tr><th>TOKEN</th><th>MAPEL</th><th>KELAS</th><th>LINK FORM</th><th>WAKTU</th><th>AKSI</th></tr></thead><tbody>" +
      (rows.map(o => `<tr><td>${esc(o.token)}</td><td>${esc(o.mapel)}</td><td>${esc(o.kelas)}</td>
        <td>${o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.link.length > 45 ? o.link.slice(0, 45) + "…" : o.link)}</a>` : ""}</td>
        <td>${esc(o.waktu)}</td><td class="act"><button data-e="${o.rowIndex}">Edit</button><button class="del" data-d="${o.rowIndex}">Hapus</button></td></tr>`).join("")
        || '<tr><td colspan="6" class="empty">Belum ada data</td></tr>') + "</tbody>";
    $("#count").textContent = rows.length + " ujian";
  } else {
    const rows = teachers.filter(o => (o.nama + " " + o.password + " " + o.tokens).toLowerCase().includes(q));
    h = "<thead><tr><th>NAMA GURU</th><th>PASSWORD</th><th>DAFTAR TOKEN</th><th>AKSI</th></tr></thead><tbody>" +
      (rows.map(o => `<tr><td>${esc(o.nama)}</td><td>${esc(o.password)}</td><td>${esc(o.tokens)}</td>
        <td class="act"><button data-e="${o.rowIndex}">Edit</button><button class="del" data-d="${o.rowIndex}">Hapus</button></td></tr>`).join("")
        || '<tr><td colspan="4" class="empty">Belum ada data</td></tr>') + "</tbody>";
    $("#count").textContent = rows.length + " guru";
  }
  $("#tbl").innerHTML = h;
}

function openForm(row) {
  editRow = row;
  const o = row ? (tab === "ujian" ? exams : teachers).find(x => x.rowIndex === row) : {};
  $("#mTitle").textContent = (row ? "Edit " : "Tambah ") + (tab === "ujian" ? "Ujian" : "Guru");
  $("#mBody").innerHTML = tab === "ujian"
    ? `<label>Token</label><div class="row"><input id="f0" value="${esc(o.token)}"><button class="gen ghost" id="gen" type="button">Acak</button></div>
       <label>Mapel</label><input id="f1" value="${esc(o.mapel)}">
       <label>Kelas</label><input id="f2" value="${esc(o.kelas)}" placeholder="mis. X-XI SEMUA Jurusan">
       <label>Link Form</label><input id="f3" value="${esc(o.link)}" placeholder="Tempel link Google Form">
       <label>Waktu Pengerjaan (menit)</label><input id="f4" type="number" min="1" value="${parseInt(o.waktu) || 90}">
       <div class="chips" id="wchips"><span class="chip" data-m="30">30</span><span class="chip" data-m="45">45</span><span class="chip" data-m="60">60</span><span class="chip" data-m="90">90</span><span class="chip" data-m="120">120</span></div>`
    : `<label>Nama Guru</label><input id="f0" value="${esc(o.nama)}">
       <label>Password</label><input id="f1" value="${esc(o.password)}">
       <label>Daftar Token</label><input id="f2" value="${esc(o.tokens)}" placeholder="pisahkan dengan koma, mis. 456, 789">
       <p class="mut">Token tersedia: ${esc(exams.map(x => x.token).join(", ") || "-")}</p>`;
  const wc = $("#wchips");
  if (wc) wc.onclick = e => { const m = e.target.dataset.m; if (m) $("#f4").value = m; };
  const g = $("#gen");
  if (g) g.onclick = () => {
    const used = new Set(exams.map(x => String(x.token))); let t;
    do { t = String(Math.floor(10000 + Math.random() * 90000)); } while (used.has(t));
    $("#f0").value = t;
  };
  $("#modal").classList.add("show");
}

const HAS_GS = typeof google !== "undefined" && !!google.script && !!google.script.run;
let PASS = "";

function authFail(e) {
  const m = (e && e.message) || String(e);
  if (/password/i.test(m)) logout();
  toast(m, true);
}
function logout() {
  PASS = ""; exams = []; teachers = [];
  $("#appView").style.display = "none"; $("#loginView").style.display = "block"; $("#pw").value = "";
}
function loginMsg(m) { const e = $("#loginErr"); e.textContent = m; e.style.display = m ? "block" : "none"; }
function login() {
  const p = $("#pw").value.trim(); if (!p) return loginMsg("Isi password dulu.");
  loginMsg("");
  if (!HAS_GS) return loginMsg("Halaman ini harus dibuka dari URL ...exec?page=admin (bukan dari file HTML di komputer).");
  const b = $("#btnLogin"); b.disabled = true;
  google.script.run
    .withSuccessHandler(() => { PASS = p; b.disabled = false; $("#loginView").style.display = "none"; $("#appView").style.display = "block"; reload(); })
    .withFailureHandler(e => {
      b.disabled = false; const m = (e && e.message) || String(e);
      loginMsg(/not a function|not defined/i.test(m) ? "Script di server belum versi terbaru. Tempel Kode.gs terbaru, lalu Terapkan > Kelola penerapan > Edit > Versi baru." : m);
    })
    .adminLogin(p);
}
function reload() {
  google.script.run.withSuccessHandler(r => { exams = r || []; render(); }).withFailureHandler(authFail).adminGetExams(PASS);
  google.script.run.withSuccessHandler(r => { teachers = r || []; render(); }).withFailureHandler(authFail).adminGetTeachers(PASS);
}

function run(fn, arg, after) {
  if (!HAS_GS) { toast("Buka dari URL ...exec?page=admin agar bisa menyimpan", true); $("#mSave").disabled = false; return; }
  google.script.run
    .withSuccessHandler(r => {
      if (r && r.status === "success") { toast(r.message + " ✓"); if (after) after(); reload(); }
      else toast((r && r.message) || "Gagal", true);
      $("#mSave").disabled = false;
    })
    .withFailureHandler(e => { $("#mSave").disabled = false; authFail(e); })[fn](PASS, arg);
}

function save() {
  let form, fn;
  if (tab === "ujian") {
    const v = [0, 1, 2, 3, 4].map(i => $("#f" + i).value.trim());
    if (!v[0] || !v[1] || !v[3]) return toast("Token, Mapel, dan Link Form wajib diisi", true);
    form = { token: v[0], mapel: v[1], kelas: v[2], link: v[3], waktu: (v[4] || "90") + " Menit" };
    fn = editRow ? "adminEditExam" : "adminAddExam";
  } else {
    const v = [0, 1, 2].map(i => $("#f" + i).value.trim());
    if (!v[0] || !v[1]) return toast("Nama dan Password wajib diisi", true);
    form = { nama: v[0], password: v[1], tokens: v[2] };
    fn = editRow ? "adminEditTeacher" : "adminAddTeacher";
  }
  if (editRow) form.rowIndex = editRow;
  $("#mSave").disabled = true;
  run(fn, form, () => $("#modal").classList.remove("show"));
}

function del(row) {
  const list = tab === "ujian" ? exams : teachers, o = list.find(x => x.rowIndex === row);
  if (!confirm("Hapus data ini?\n" + (tab === "ujian" ? o.token + " · " + o.mapel : o.nama))) return;
  run(tab === "ujian" ? "adminDeleteExam" : "adminDeleteTeacher", row);
}

$("#btnRefresh").onclick = reload;
$("#btnAdd").onclick = () => openForm(null);
$("#q").oninput = render;
$("#mCancel").onclick = () => $("#modal").classList.remove("show");
$("#mSave").onclick = save;
$(".tabs").onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  tab = t; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("#q").value = ""; render();
};
$("#tbl").onclick = e => {
  if (e.target.dataset.e) openForm(+e.target.dataset.e);
  if (e.target.dataset.d) del(+e.target.dataset.d);
};
$("#btnLogin").onclick = login;
$("#pw").addEventListener("keydown", e => e.key === "Enter" && login());
$("#btnOut").onclick = logout;
</script>
</body>
</html>
