<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Token Ulangan – Login Guru</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7488;--primary:#4f46e5;--primary-t:#fff;--border:#d9deea;--err:#c62828;--warn:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#181e30;--text:#e8ebf5;--muted:#98a1b8;--primary:#7c83ff;--primary-t:#0f1320;--border:#2b3350;--err:#ff7b7b;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#181e30;--text:#e8ebf5;--muted:#98a1b8;--primary:#7c83ff;--primary-t:#0f1320;--border:#2b3350;--err:#ff7b7b;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.3rem;margin:8px 0 18px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;text-align:center}
input,select{width:100%;padding:12px 14px;font-size:1.1rem;text-align:center;border:1.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);outline:none}
select{text-align-last:center}
button{width:100%;margin-top:14px;padding:13px;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:var(--primary);color:var(--primary-t);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:10px;color:var(--err);font-size:.9rem;min-height:1.2em}
.meta{color:var(--muted);font-size:.92rem}
.tok{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:800;letter-spacing:.18em;margin:10px 0 6px;font-variant-numeric:tabular-nums;padding-left:.18em}
.sisa{font-weight:700;font-variant-numeric:tabular-nums}
.sisa.warn{color:var(--warn)}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--primary);transition:width 1s linear}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Token Ulangan (Guru)</h1>
  <div class="card" id="pinBox">
    <select id="user"><option value="">Memuat daftar guru...</option></select>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
    <button id="masuk">Masuk</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="hidden" id="head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px">
    <b id="halo"></b><button id="keluar" style="width:auto;margin:0;padding:8px 14px;background:transparent;color:var(--muted);border:1px solid var(--border)">Keluar</button>
  </div>
  <div id="list"></div>
  <div class="meta hidden" id="info" style="text-align:center">Token berganti otomatis. Siswa yang baru berganti diberi toleransi 1 menit.</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJ63tXWqn6LyJAdOuT4CT3fejPlJcpEqh0rRJDF4FCi1txXudJ6nVGYFuN7FfRQz0/exec";
const $ = id => document.getElementById(id);
let user = "", pw = "", data = [], fetchedAt = 0, busy = false;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

async function daftarGuru(){
  try{
    const res = await fetch(SCRIPT_URL + "?action=daftarGuru");
    const r = await res.json();
    if(!r.ok) throw new Error(r.error || "Gagal memuat");
    $("user").innerHTML = '<option value="">Pilih Nama Guru</option>' + r.guru.map(g=>'<option value="'+esc(g.username)+'">'+esc(g.nama)+'</option>').join("");
  }catch(e){ 
    $("user").innerHTML = '<option value="">Gagal memuat daftar guru</option>'; 
  }
}

function keluar(){
  user = pw = ""; data = []; $("list").innerHTML = "";
  $("pass").value = ""; $("pinBox").classList.remove("hidden");
  $("head").classList.add("hidden"); $("info").classList.add("hidden");
}

async function muat(){
  if(busy) return; busy = true;
  try{
    const res = await fetch(SCRIPT_URL + "?action=tokenGuru&user=" + encodeURIComponent(user) + "&pass=" + encodeURIComponent(pw));
    const r = await res.json();
    if(!r.ok){ const m = r.error || "Gagal."; keluar(); $("msg").textContent = m; return; }
    data = r.daftar; fetchedAt = Date.now();
    $("halo").textContent = "Halo, " + r.nama;
    $("pinBox").classList.add("hidden"); $("head").classList.remove("hidden"); $("info").classList.remove("hidden");
    if(!data.length) $("list").innerHTML = '<div class="card meta">Tidak ada jadwal ulangan aktif untuk Anda hari ini.<br>Pastikan tanggal hari ini di sheet sesuai dan kolom <b>guru</b> berisi username Anda.</div>';
  }catch(e){ $("msg").textContent = "Gagal terhubung ke server."; }
  finally{ busy = false; }
}

function gambar(){
  if(!data.length) return;
  const el = Math.floor((Date.now()-fetchedAt)/1000);
  $("list").innerHTML = data.map(d=>{
    const sisa = d.sisa - el, total = d.rotasi*60;
    return '<div class="card"><div class="meta">'+esc(d.mapel)+' · '+esc(d.kelas)+' · '+esc(d.jam)+'</div>'
      +'<div class="tok">'+esc(d.token)+'</div>'
      +'<div class="meta">Berganti dalam <span class="sisa'+(sisa<60?' warn':'')+'">'+fmt(sisa)+'</span></div>'
      +'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,sisa/total*100))+'%"></i></div></div>';
  }).join("");
  if(data.some(d=>d.sisa-el<=0)) muat();
}

$("masuk").onclick = async ()=>{
  user = $("user").value; pw = $("pass").value; $("msg").textContent = "";
  if(!user) return $("msg").textContent = "Pilih nama guru terlebih dahulu.";
  if(!pw) return $("msg").textContent = "Password wajib diisi.";
  $("masuk").disabled = true; $("masuk").textContent = "Memeriksa...";
  await muat(); gambar();
  $("masuk").disabled = false; $("masuk").textContent = "Masuk";
};

$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("masuk").click()});
$("keluar").onclick = keluar;
setInterval(()=>{ if(user) gambar(); },1000);
setInterval(()=>{ if(user) muat(); },30000);
daftarGuru();
</script>
</body>
</html>
